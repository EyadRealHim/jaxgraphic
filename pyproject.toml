[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.18.0"]

[project]
authors = [
  {name = "EyadRealHim", email = "eyad.realhim@gmail.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jax>=0.4.25",
]
description = "A tiny differentiable 2D drawing library on JAX."
license = {text = "MIT"}
name = "jaxgraphic"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.01"

[project.urls]
Homepage = "https://github.com/EyadRealHim/jaxgraphic"
Issues = "https://github.com/EyadRealHim/jaxgraphic/issues"
Repository = "https://github.com/EyadRealHim/jaxgraphic.git"

[tool.hatch.build.targets.wheel]
packages = ["jaxgraphic"]
